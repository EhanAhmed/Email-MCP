services:
  email-mcp:
    build:
      context: .
    image: email-smtp-imap-mcp:local
    restart: always
    environment:
      EMAIL_ENV_FILE: /app/.env
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "8000"
    volumes:
      - ./.env:/app/.env:ro
    expose:
      - "8000"
    networks:
      - litellm-langfuse-net

networks:
  litellm-langfuse-net:
    external: true
    name: litellm-langfuse-net